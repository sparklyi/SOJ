services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${SOJ_POSTGRES_PASSWORD:?SOJ_POSTGRES_PASSWORD is required}
    ports: !reset []

  redis:
    ports: !reset []

  minio:
    environment:
      MINIO_ROOT_USER: ${SOJ_STORAGE_ACCESS_KEY:?SOJ_STORAGE_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${SOJ_STORAGE_SECRET_KEY:?SOJ_STORAGE_SECRET_KEY is required}
    healthcheck:
      test:
        - CMD-SHELL
        - 'mc alias set local http://localhost:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1 && mc ready local >/dev/null 2>&1'
    ports: !reset []

  minio-init:
    environment:
      MINIO_ROOT_USER: ${SOJ_STORAGE_ACCESS_KEY:?SOJ_STORAGE_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${SOJ_STORAGE_SECRET_KEY:?SOJ_STORAGE_SECRET_KEY is required}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 1
        done
        mc mb --ignore-existing local/soj

  seed:
    environment:
      PGPASSWORD: ${SOJ_POSTGRES_PASSWORD:?SOJ_POSTGRES_PASSWORD is required}
      # 由 seed 的 entrypoint 在容器「运行时」读取；基础文件里那条守卫必须写成 $$
      # 才读得到这个值。改动后跑 scripts/ci/check-prod-compose.sh 验证渲染结果。
      SOJ_SEED_FAKE_LANGUAGE: "false"

  migrate:
    environment:
      SOJ_DATABASE_DSN: ${SOJ_DATABASE_DSN:?SOJ_DATABASE_DSN is required}

  api:
    environment:
      SOJ_ENV: prod
      SOJ_DATABASE_DSN: ${SOJ_DATABASE_DSN:?SOJ_DATABASE_DSN is required}
      SOJ_JWT_SECRET: ${SOJ_JWT_SECRET:?SOJ_JWT_SECRET is required}
      SOJ_STORAGE_ACCESS_KEY: ${SOJ_STORAGE_ACCESS_KEY:?SOJ_STORAGE_ACCESS_KEY is required}
      SOJ_STORAGE_SECRET_KEY: ${SOJ_STORAGE_SECRET_KEY:?SOJ_STORAGE_SECRET_KEY is required}
      SOJ_JUDGE_ENDPOINT: agent://local
    ports: !override
      - "127.0.0.1:8080:8080"

  worker:
    environment:
      SOJ_ENV: prod
      SOJ_DATABASE_DSN: ${SOJ_DATABASE_DSN:?SOJ_DATABASE_DSN is required}
      SOJ_STORAGE_ACCESS_KEY: ${SOJ_STORAGE_ACCESS_KEY:?SOJ_STORAGE_ACCESS_KEY is required}
      SOJ_STORAGE_SECRET_KEY: ${SOJ_STORAGE_SECRET_KEY:?SOJ_STORAGE_SECRET_KEY is required}
    ports: !override
      - "127.0.0.1:8081:8081"

  judge-agent:
    environment:
      SOJ_ENV: prod
      SOJ_STORAGE_ACCESS_KEY: ${SOJ_STORAGE_ACCESS_KEY:?SOJ_STORAGE_ACCESS_KEY is required}
      SOJ_STORAGE_SECRET_KEY: ${SOJ_STORAGE_SECRET_KEY:?SOJ_STORAGE_SECRET_KEY is required}
      SOJ_JUDGE_ENDPOINT: agent://local
      SOJ_JUDGE_SANDBOX_BACKEND: docker
      SOJ_DOCKER_RUNNER_RUNTIME: runsc
      SOJ_DOCKER_RUNNER_IMAGE_GO: ${SOJ_DOCKER_RUNNER_IMAGE_GO:?SOJ_DOCKER_RUNNER_IMAGE_GO is required}
      SOJ_DOCKER_RUNNER_IMAGE_CPP17: ${SOJ_DOCKER_RUNNER_IMAGE_CPP17:?SOJ_DOCKER_RUNNER_IMAGE_CPP17 is required}
      SOJ_DOCKER_RUNNER_WORKDIR: ${SOJ_DOCKER_RUNNER_WORKDIR:-/var/lib/soj/runner-work}
    ports: !override
      - "127.0.0.1:8082:8082"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SOJ_DOCKER_RUNNER_WORKDIR:-/var/lib/soj/runner-work}:${SOJ_DOCKER_RUNNER_WORKDIR:-/var/lib/soj/runner-work}

  prometheus:
    ports: !override
      - "127.0.0.1:9090:9090"
