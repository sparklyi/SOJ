services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${SOJ_POSTGRES_PASSWORD:?SOJ_POSTGRES_PASSWORD is required}
    ports: !reset []

  redis:
    ports: !reset []

  minio:
    environment:
      MINIO_ROOT_USER: ${SOJ_STORAGE_ACCESS_KEY:?SOJ_STORAGE_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${SOJ_STORAGE_SECRET_KEY:?SOJ_STORAGE_SECRET_KEY is required}
    healthcheck:
      test:
        - CMD-SHELL
        - 'mc alias set local http://localhost:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1 && mc ready local >/dev/null 2>&1'
    ports: !reset []

  minio-init:
    environment:
      MINIO_ROOT_USER: ${SOJ_STORAGE_ACCESS_KEY:?SOJ_STORAGE_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${SOJ_STORAGE_SECRET_KEY:?SOJ_STORAGE_SECRET_KEY is required}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 1
        done
        mc mb --ignore-existing local/soj

  seed:
    environment:
      PGPASSWORD: ${SOJ_POSTGRES_PASSWORD:?SOJ_POSTGRES_PASSWORD is required}
      SOJ_SEED_FAKE_LANGUAGE: "false"

  migrate:
    environment:
      SOJ_DATABASE_DSN: ${SOJ_DATABASE_DSN:?SOJ_DATABASE_DSN is required}

  api:
    environment:
      SOJ_ENV: ${SOJ_ENV:-prod}
      SOJ_HTTP_ADDR: ":8080"
      SOJ_DATABASE_DSN: ${SOJ_DATABASE_DSN:?SOJ_DATABASE_DSN is required}
      SOJ_REDIS_ADDR: redis:6379
      SOJ_STORAGE_ENDPOINT: http://minio:9000
      SOJ_STORAGE_BUCKET: ${SOJ_STORAGE_BUCKET:-soj}
      SOJ_STORAGE_ACCESS_KEY: ${SOJ_STORAGE_ACCESS_KEY:?SOJ_STORAGE_ACCESS_KEY is required}
      SOJ_STORAGE_SECRET_KEY: ${SOJ_STORAGE_SECRET_KEY:?SOJ_STORAGE_SECRET_KEY is required}
      SOJ_STORAGE_PATH_STYLE: "true"
      SOJ_JWT_SECRET: ${SOJ_JWT_SECRET:?SOJ_JWT_SECRET is required}
      SOJ_JUDGE_ENDPOINT: agent://local
      SOJ_JUDGE_RUN_PARALLELISM: ${SOJ_JUDGE_RUN_PARALLELISM:-1}
    ports: !override
      - "127.0.0.1:8080:8080"

  worker:
    environment:
      SOJ_ENV: ${SOJ_ENV:-prod}
      SOJ_WORKER_HEALTH_ADDR: ":8081"
      SOJ_DATABASE_DSN: ${SOJ_DATABASE_DSN:?SOJ_DATABASE_DSN is required}
      SOJ_REDIS_ADDR: redis:6379
      SOJ_REDIS_STREAM: soj:judge:tasks
      SOJ_REDIS_GROUP: judge-workers
      SOJ_REDIS_STREAM_MAX_LEN: ${SOJ_REDIS_STREAM_MAX_LEN:-100000}
      SOJ_REDIS_DEAD_STREAM_MAX_LEN: ${SOJ_REDIS_DEAD_STREAM_MAX_LEN:-10000}
      SOJ_JUDGE_RESULT_STREAM: soj:judge:results
      SOJ_JUDGE_RESULT_GROUP: judge-result-consumers
      SOJ_STORAGE_ENDPOINT: http://minio:9000
      SOJ_STORAGE_BUCKET: ${SOJ_STORAGE_BUCKET:-soj}
      SOJ_STORAGE_ACCESS_KEY: ${SOJ_STORAGE_ACCESS_KEY:?SOJ_STORAGE_ACCESS_KEY is required}
      SOJ_STORAGE_SECRET_KEY: ${SOJ_STORAGE_SECRET_KEY:?SOJ_STORAGE_SECRET_KEY is required}
      SOJ_STORAGE_PATH_STYLE: "true"
      SOJ_JWT_SECRET: ${SOJ_JWT_SECRET:?SOJ_JWT_SECRET is required}
      SOJ_JUDGE_ENDPOINT: agent://local
    ports: !override
      - "127.0.0.1:8081:8081"

  judge-agent:
    environment:
      SOJ_ENV: prod
      SOJ_JUDGE_AGENT_HEALTH_ADDR: ":8082"
      SOJ_REDIS_ADDR: redis:6379
      SOJ_REDIS_STREAM_MAX_LEN: ${SOJ_REDIS_STREAM_MAX_LEN:-100000}
      SOJ_REDIS_DEAD_STREAM_MAX_LEN: ${SOJ_REDIS_DEAD_STREAM_MAX_LEN:-10000}
      SOJ_STORAGE_ENDPOINT: http://minio:9000
      SOJ_STORAGE_BUCKET: ${SOJ_STORAGE_BUCKET:-soj}
      SOJ_STORAGE_ACCESS_KEY: ${SOJ_STORAGE_ACCESS_KEY:?SOJ_STORAGE_ACCESS_KEY is required}
      SOJ_STORAGE_SECRET_KEY: ${SOJ_STORAGE_SECRET_KEY:?SOJ_STORAGE_SECRET_KEY is required}
      SOJ_STORAGE_PATH_STYLE: "true"
      SOJ_JUDGE_ENDPOINT: agent://local
      SOJ_JUDGE_CLEANUP_TIMEOUT: ${SOJ_JUDGE_CLEANUP_TIMEOUT:-5s}
      SOJ_JUDGE_SANDBOX_BACKEND: docker
      SOJ_JUDGE_REQUEST_STREAM: soj:judge:tasks
      SOJ_JUDGE_AGENT_GROUP: judge-agents
      SOJ_JUDGE_RESULT_STREAM: soj:judge:results
      SOJ_JUDGE_RESULT_GROUP: judge-result-consumers
      SOJ_JUDGE_PARALLELISM: ${SOJ_JUDGE_PARALLELISM:-1}
      SOJ_JUDGE_LANGUAGE_SLOTS: ${SOJ_JUDGE_LANGUAGE_SLOTS:-go=1,cpp17=1}
      SOJ_JUDGE_MAX_BATCH: ${SOJ_JUDGE_MAX_BATCH:-1}
      SOJ_DOCKER_RUNNER_RUNTIME: runsc
      SOJ_DOCKER_RUNNER_IMAGE_GO: ${SOJ_DOCKER_RUNNER_IMAGE_GO:?SOJ_DOCKER_RUNNER_IMAGE_GO is required}
      SOJ_DOCKER_RUNNER_IMAGE_CPP17: ${SOJ_DOCKER_RUNNER_IMAGE_CPP17:?SOJ_DOCKER_RUNNER_IMAGE_CPP17 is required}
      SOJ_DOCKER_RUNNER_WORKDIR: ${SOJ_DOCKER_RUNNER_WORKDIR:-/var/lib/soj/runner-work}
    ports: !override
      - "127.0.0.1:8082:8082"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SOJ_DOCKER_RUNNER_WORKDIR:-/var/lib/soj/runner-work}:${SOJ_DOCKER_RUNNER_WORKDIR:-/var/lib/soj/runner-work}

  prometheus:
    ports: !override
      - "127.0.0.1:9090:9090"
