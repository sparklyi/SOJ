name: Python 3
version: "3.12"
source_file: main.py
# py_compile is a syntax check, not a build: Python has no binary to produce.
compile: ["python3", "-m", "py_compile", "{{source}}"]
run: ["python3", "{{source}}"]
image: ${SOJ_RUNNER_REGISTRY:-ghcr.io/sparklyi}/soj-runner-python3:${SOJ_RUNNER_TAG:-main}
time_limit_ms: 2000
memory_limit_kb: 262144
