# C reuses the C++ runner image: g++ pulls in gcc, and one image means one build.
name: C
version: C17
source_file: main.c
binary_file: main
compile: ["gcc", "-std=c17", "-O2", "-pipe", "-o", "{{binary}}", "{{source}}"]
run: ["{{binary}}"]
image: ${SOJ_RUNNER_REGISTRY:-ghcr.io/sparklyi}/soj-runner-cpp17:${SOJ_RUNNER_TAG:-main}
time_limit_ms: 1000
memory_limit_kb: 262144
