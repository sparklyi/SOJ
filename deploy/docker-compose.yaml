# Shared by every Go service in this stack. The configuration file is the
# source of truth; these environment variables only fill its ${...}
# placeholders, which keeps secrets and per-deployment knobs out of the file.
# Every placeholder deploy/config.yaml declares is forwarded here, so a value
# set in the deployment environment reaches the container. Secrets are not
# shared: only the commands that need them receive them.
x-soj-common: &soj-common
  SOJ_CONFIG_FILE: /etc/soj/config.yaml
  SOJ_ENV: ${SOJ_ENV:-docker}
  SOJ_STORAGE_BUCKET: ${SOJ_STORAGE_BUCKET:-}
  SOJ_JUDGE_ENDPOINT: ${SOJ_JUDGE_ENDPOINT:-}
  SOJ_JUDGE_SANDBOX_BACKEND: ${SOJ_JUDGE_SANDBOX_BACKEND:-}
  SOJ_JUDGE_CLEANUP_TIMEOUT: ${SOJ_JUDGE_CLEANUP_TIMEOUT:-}
  SOJ_JUDGE_AGENT_STREAMS: ${SOJ_JUDGE_AGENT_STREAMS:-}
  SOJ_JUDGE_PARALLELISM: ${SOJ_JUDGE_PARALLELISM:-}
  SOJ_JUDGE_LANGUAGE_SLOTS: ${SOJ_JUDGE_LANGUAGE_SLOTS:-}
  SOJ_JUDGE_MAX_BATCH: ${SOJ_JUDGE_MAX_BATCH:-}
  SOJ_JUDGE_RUN_PARALLELISM: ${SOJ_JUDGE_RUN_PARALLELISM:-}
  SOJ_JUDGE_RUN_PER_USER: ${SOJ_JUDGE_RUN_PER_USER:-}
  SOJ_JUDGE_RUN_STDIN_MAX_BYTES: ${SOJ_JUDGE_RUN_STDIN_MAX_BYTES:-}
  SOJ_RUN_RETENTION_DAYS: ${SOJ_RUN_RETENTION_DAYS:-}
  SOJ_RUN_RETENTION_INTERVAL: ${SOJ_RUN_RETENTION_INTERVAL:-}
  SOJ_RUN_RETENTION_BATCH: ${SOJ_RUN_RETENTION_BATCH:-}
  SOJ_DOCKER_RUNNER_RUNTIME: ${SOJ_DOCKER_RUNNER_RUNTIME:-}
  SOJ_DOCKER_RUNNER_WORKDIR: ${SOJ_DOCKER_RUNNER_WORKDIR:-}
  SOJ_DOCKER_RUNNER_USER: ${SOJ_DOCKER_RUNNER_USER:-}
  # The language files name their runner images; these fill the placeholders.
  SOJ_RUNNER_REGISTRY: ${SOJ_RUNNER_REGISTRY:-}
  SOJ_RUNNER_TAG: ${SOJ_RUNNER_TAG:-}
  SOJ_TRACING_ENABLED: ${SOJ_TRACING_ENABLED:-}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
  OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: soj
      POSTGRES_PASSWORD: soj
      POSTGRES_DB: soj
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soj -d soj"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - soj-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"
    volumes:
      - soj-redis-data:/data

  minio:
    # MinIO 已下架 Docker Hub 镜像，quay.io 匿名拉取现在返回 401。
    # coollabsio/minio 用官方源码构建同样的 RELEASE 版本，并附带签名校验过的 mc。
    # tag + digest 双重固定，保证内容可复现。
    image: coollabsio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a4938f37f1be1841b8e7b627ad0207b265345fd0d063e42d7410c78af0e63e68
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD-SHELL", "mc alias set local http://localhost:9000 minioadmin minioadmin >/dev/null 2>&1 && mc ready local >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - soj-minio-data:/data

  minio-init:
    # minio 镜像自带 mc，init 任务复用同一镜像，不再依赖单独的 mc 镜像。
    image: coollabsio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a4938f37f1be1841b8e7b627ad0207b265345fd0d063e42d7410c78af0e63e68
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          sleep 1
        done
        mc mb --ignore-existing local/soj

  seed:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: soj
      # 本地栈默认 true：没有特权 sandbox 时用 fake 引擎跑通完整异步评测。
      # 生产由 docker-compose.prod.yaml 覆盖为 "false"。
      SOJ_SEED_FAKE_LANGUAGE: ${SOJ_SEED_FAKE_LANGUAGE:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -c
      - |
        # 这里必须写 $$（compose 会还原成字面量 $），让容器在「运行时」读这个变量。
        # 若写成单个 $ 的插值形式，compose 会在**创建容器那一刻**就把值内联进这段
        # 脚本文本（当时变量没设置 -> 内联成 "true"），之后任何只改 environment 的
        # override（包括生产 compose）都读不到它，测试语言就会一路种进生产库。
        # 注意 compose 会插值整段脚本、连注释也一起，所以注释里同样不能出现插值式。
        # 改动此块后用 scripts/ci/check-prod-compose.sh 验证渲染结果。
        if [ "$${SOJ_SEED_FAKE_LANGUAGE:-true}" = "true" ]; then
          psql -h postgres -U soj -d soj -v ON_ERROR_STOP=1 -c "
            INSERT INTO languages (
              engine,
              engine_language_id,
              name,
              default_time_limit_ms,
              default_memory_limit_kb,
              enabled
            ) VALUES (
              'fake',
              'accepted',
              'Fake Accepted',
              1000,
              65536,
              true
            )
            ON CONFLICT (engine, engine_language_id) DO UPDATE
            SET enabled = true,
                default_time_limit_ms = EXCLUDED.default_time_limit_ms,
                default_memory_limit_kb = EXCLUDED.default_memory_limit_kb,
                updated_at = now();"
        fi


  migrate:
    build:
      context: ..
      dockerfile: Dockerfile.v2
      args:
        COMMAND: soj-migrate
    environment:
      <<: *soj-common
      SOJ_DATABASE_DSN: ${SOJ_DATABASE_DSN:-postgres://soj:soj@postgres:5432/soj?sslmode=disable}
    configs:
      - source: soj-config
        target: /etc/soj/config.yaml
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: Dockerfile.v2
      args:
        COMMAND: soj-api
    environment:
      <<: *soj-common
      SOJ_DATABASE_DSN: ${SOJ_DATABASE_DSN:-postgres://soj:soj@postgres:5432/soj?sslmode=disable}
      SOJ_JWT_SECRET: ${SOJ_JWT_SECRET:-local-dev-secret-change-me}
      SOJ_STORAGE_ACCESS_KEY: ${SOJ_STORAGE_ACCESS_KEY:-minioadmin}
      SOJ_STORAGE_SECRET_KEY: ${SOJ_STORAGE_SECRET_KEY:-minioadmin}
    configs:
      - source: soj-config
        target: /etc/soj/config.yaml
    volumes:
      - ./languages:/etc/soj/languages:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/readyz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8080:8080"

  worker:
    build:
      context: ..
      dockerfile: Dockerfile.v2
      args:
        COMMAND: soj-worker
    environment:
      <<: *soj-common
      SOJ_DATABASE_DSN: ${SOJ_DATABASE_DSN:-postgres://soj:soj@postgres:5432/soj?sslmode=disable}
      SOJ_STORAGE_ACCESS_KEY: ${SOJ_STORAGE_ACCESS_KEY:-minioadmin}
      SOJ_STORAGE_SECRET_KEY: ${SOJ_STORAGE_SECRET_KEY:-minioadmin}
    configs:
      - source: soj-config
        target: /etc/soj/config.yaml
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/readyz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8081:8081"

  judge-agent:
    build:
      context: ..
      dockerfile: Dockerfile.v2
      args:
        COMMAND: soj-judge-agent
    environment:
      <<: *soj-common
      SOJ_STORAGE_ACCESS_KEY: ${SOJ_STORAGE_ACCESS_KEY:-minioadmin}
      SOJ_STORAGE_SECRET_KEY: ${SOJ_STORAGE_SECRET_KEY:-minioadmin}
    configs:
      - source: soj-config
        target: /etc/soj/config.yaml
    volumes:
      - ./languages:/etc/soj/languages:ro
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/readyz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      # A first start pulls the runner images; that must not count as unhealthy.
      start_period: 10m
    ports:
      - "8082:8082"

  prometheus:
    image: prom/prometheus:v3.4.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./:/etc/prometheus:ro
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
      judge-agent:
        condition: service_healthy
    ports:
      - "9090:9090"

configs:
  soj-config:
    file: ./config.yaml

volumes:
  soj-postgres-data:
  soj-redis-data:
  soj-minio-data:
