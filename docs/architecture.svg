<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 872" width="800" height="872" role="img" aria-label="SOJ architecture">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/>
    </marker>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="800" height="872" rx="16" fill="#ffffff"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- 0: client -->
    <rect x="40" y="40" width="520" height="68" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5" filter="url(#s)"/>
    <text x="68" y="69" font-size="17" font-weight="600" fill="#3730a3">SOJ-web</text>
    <text x="68" y="91" font-size="12.5" fill="#6366f1">Next.js frontend</text>

    <!-- 1: api -->
    <rect x="40" y="160" width="520" height="68" rx="12" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.5" filter="url(#s)"/>
    <text x="68" y="189" font-size="17" font-weight="600" fill="#0e7490">soj-api</text>
    <text x="68" y="211" font-size="12.5" fill="#0891b2">HTTP API · auth · problems · contests</text>

    <!-- 2: postgres -->
    <rect x="40" y="280" width="520" height="68" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#s)"/>
    <text x="68" y="309" font-size="17" font-weight="600" fill="#15803d">PostgreSQL</text>
    <text x="68" y="331" font-size="12.5" fill="#16a34a">submissions · tasks · verdicts</text>

    <!-- 3: worker -->
    <rect x="40" y="400" width="520" height="68" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#s)"/>
    <text x="68" y="429" font-size="17" font-weight="600" fill="#c2410c">soj-worker</text>
    <text x="68" y="451" font-size="12.5" fill="#ea580c">dispatch · result consumer · retry · reconciliation</text>

    <!-- 4: redis -->
    <rect x="40" y="520" width="520" height="68" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#s)"/>
    <text x="68" y="549" font-size="17" font-weight="600" fill="#15803d">Redis Streams</text>
    <text x="68" y="571" font-size="12.5" fill="#16a34a">judge requests · results</text>

    <!-- 5: agent -->
    <rect x="40" y="640" width="520" height="68" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#s)"/>
    <text x="68" y="669" font-size="17" font-weight="600" fill="#c2410c">soj-judge-agent</text>
    <text x="68" y="691" font-size="12.5" fill="#ea580c">consume requests · control concurrency</text>

    <!-- 6: executor -->
    <rect x="40" y="760" width="520" height="68" rx="12" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" filter="url(#s)"/>
    <text x="68" y="789" font-size="17" font-weight="600" fill="#7e22ce">judgecore → sandbox</text>
    <text x="68" y="811" font-size="12.5" fill="#9333ea">compile · run · check</text>

    <!-- S3 -->
    <rect x="610" y="644" width="150" height="60" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#s)"/>
    <text x="685" y="670" text-anchor="middle" font-size="15" font-weight="600" fill="#15803d">S3 · MinIO</text>
    <text x="685" y="690" text-anchor="middle" font-size="12" fill="#16a34a">source · test cases</text>

    <!-- flow arrows -->
    <g fill="none" stroke="#94a3b8" stroke-width="1.7" stroke-linecap="round">
      <path d="M300 112 L300 156" marker-end="url(#a)"/>
      <path d="M300 232 L300 276" marker-end="url(#a)"/>
      <path d="M300 352 L300 396" marker-start="url(#a)" marker-end="url(#a)"/>
      <path d="M300 472 L300 516" marker-start="url(#a)" marker-end="url(#a)"/>
      <path d="M300 592 L300 636" marker-start="url(#a)" marker-end="url(#a)"/>
      <path d="M300 712 L300 756" marker-end="url(#a)"/>
    </g>
    <path d="M560 674 H606" fill="none" stroke="#94a3b8" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/>

    <!-- arrow labels -->
    <g font-size="12" fill="#64748b">
      <text x="312" y="138">HTTPS</text>
      <text x="312" y="258">write task</text>
      <text x="312" y="378">claim / persist</text>
      <text x="312" y="498">request / result</text>
      <text x="312" y="618">request / result</text>
      <text x="312" y="738">execute</text>
      <text x="566" y="666" text-anchor="end" fill="#94a3b8" font-size="11">read source</text>
    </g>
  </g>
</svg>
