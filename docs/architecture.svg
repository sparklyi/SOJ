<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480" role="img" aria-label="SOJ backend flow">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="860" height="480" rx="16" fill="#ffffff"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- boxes -->
    <g filter="url(#sh)">
      <rect x="40" y="24" width="130" height="52" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
      <rect x="40" y="104" width="130" height="56" rx="10" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.5"/>
      <rect x="40" y="230" width="130" height="60" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
      <rect x="210" y="230" width="120" height="60" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
      <rect x="370" y="230" width="130" height="60" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
      <rect x="540" y="230" width="130" height="60" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
      <rect x="710" y="230" width="110" height="60" rx="10" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
      <rect x="540" y="380" width="130" height="56" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    </g>
    <g text-anchor="middle">
      <text x="105" y="55" font-size="15" font-weight="600" fill="#3730a3">SOJ-web</text>
      <text x="105" y="138" font-size="15" font-weight="600" fill="#0e7490">soj-api</text>
      <text x="105" y="265" font-size="15" font-weight="600" fill="#15803d">PostgreSQL</text>
      <text x="270" y="265" font-size="15" font-weight="600" fill="#c2410c">soj-worker</text>
      <text x="435" y="265" font-size="15" font-weight="600" fill="#15803d">Redis Streams</text>
      <text x="605" y="265" font-size="15" font-weight="600" fill="#c2410c">soj-judge-agent</text>
      <text x="765" y="265" font-size="15" font-weight="600" fill="#7e22ce">Sandbox</text>
      <text x="605" y="413" font-size="15" font-weight="600" fill="#15803d">S3 · MinIO</text>
    </g>

    <!-- forward flow (blue) -->
    <g fill="none" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round">
      <path d="M92 76 V100" marker-end="url(#ab)"/>
      <path d="M92 160 V226" marker-end="url(#ab)"/>
      <path d="M170 260 H206" marker-end="url(#ab)"/>
      <path d="M330 260 H366" marker-end="url(#ab)"/>
      <path d="M500 260 H536" marker-end="url(#ab)"/>
      <path d="M670 260 H706" marker-end="url(#ab)"/>
    </g>

    <!-- read source (dashed) -->
    <path d="M605 290 V376" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ag)"/>

    <!-- return flow (orange) -->
    <g fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M118 100 V80" stroke-dasharray="5 4" marker-end="url(#ao)"/>
      <path d="M585 290 V330 H460 V294" marker-end="url(#ao)"/>
      <path d="M435 290 V356 H270 V294" marker-end="url(#ao)"/>
      <path d="M300 290 V382 H92 V294" marker-end="url(#ao)"/>
    </g>

    <!-- labels -->
    <g font-size="11" fill="#1d4ed8">
      <text x="136" y="95">POST /submissions</text>
      <text x="112" y="196">insert submission + queued task</text>
      <text x="188" y="222" text-anchor="middle">claim task</text>
      <text x="348" y="222" text-anchor="middle">judge.request.v2</text>
      <text x="518" y="222" text-anchor="middle">judge.request.v2</text>
      <text x="688" y="222" text-anchor="middle">compile + run</text>
    </g>
    <g font-size="11" fill="#b45309">
      <text x="136" y="107">202 Accepted</text>
      <text x="522" y="324" text-anchor="middle">judge.result.v1</text>
      <text x="352" y="350" text-anchor="middle">judge.result.v1</text>
      <text x="196" y="376" text-anchor="middle">write verdict (idempotent)</text>
    </g>
    <text x="618" y="338" font-size="11" fill="#94a3b8">read source</text>
  </g>
</svg>
