name: Publish Runner Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - "deploy/languages/**"
      - ".github/workflows/publish-runner-images.yml"

permissions:
  contents: read
  packages: write

jobs:
  discover:
    name: Discover languages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # One language is one directory under deploy/languages; a language without
      # a Dockerfile reuses an image published elsewhere and is skipped here.
      - name: List languages with a Dockerfile
        id: list
        run: |
          matrix="$(for dockerfile in deploy/languages/*/Dockerfile; do
            [ -f "$dockerfile" ] || continue
            dir="${dockerfile%/Dockerfile}"
            printf '{"image":"soj-runner-%s","context":"%s","dockerfile":"%s"}\n' \
              "$(basename "$dir")" "$dir" "$dockerfile"
          done | jq -sc .)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  runner-images:
    name: ${{ matrix.image }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
