name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: soj
          POSTGRES_PASSWORD: soj
          POSTGRES_DB: soj
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soj -d soj"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # One database, two readers: soj-migrate takes the first, and the
      # DSN-gated integration tests (cursor pagination) take the second.
      SOJ_DATABASE_DSN: postgres://soj:soj@localhost:5432/soj?sslmode=disable
      SOJ_TEST_DATABASE_DSN: postgres://soj:soj@localhost:5432/soj?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

      # Runs before the tests so the DSN-gated integration tests have a schema.
      - name: Migrate test database
        run: go run ./cmd/soj-migrate --config deploy/config.yaml up

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Validate Compose
        run: docker compose -f deploy/docker-compose.yaml config

      - name: Validate Docker runner Compose
        run: COMPOSE_FILE=deploy/docker-compose.yaml:deploy/docker-compose.docker-runner.yaml docker compose config

      - name: Validate Production Compose
        run: scripts/ci/check-prod-compose.sh

  smoke:
    name: Docker Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_FILE: deploy/docker-compose.yaml:deploy/docker-compose.ci-images.yaml
      COMPOSE_PROJECT_NAME: soj-ci-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build service images
        uses: docker/bake-action@v7
        with:
          files: |
            deploy/docker-compose.yaml
            deploy/docker-compose.ci-images.yaml
          targets: api,worker,judge-agent,migrate
          load: true
          provenance: false
          set: |
            api.cache-from=type=gha,scope=soj-smoke-api
            api.cache-to=type=gha,scope=soj-smoke-api,mode=max
            worker.cache-from=type=gha,scope=soj-smoke-worker
            worker.cache-to=type=gha,scope=soj-smoke-worker,mode=max
            judge-agent.cache-from=type=gha,scope=soj-smoke-judge-agent
            judge-agent.cache-to=type=gha,scope=soj-smoke-judge-agent,mode=max
            migrate.cache-from=type=gha,scope=soj-smoke-migrate
            migrate.cache-to=type=gha,scope=soj-smoke-migrate,mode=max

      - name: Start smoke stack
        # Start only what the smoke script touches. Compose still starts the
        # dependencies (postgres, redis, minio, migrate, seed); prometheus has
        # no assertions and would cost an image pull on every run.
        run: docker compose up -d api worker judge-agent

      - name: Run smoke test
        run: ./deploy/smoke.sh

      - name: Dump smoke logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color api worker judge-agent migrate seed postgres redis minio || true

      - name: Stop smoke stack
        if: always()
        run: docker compose down -v --remove-orphans || true
