name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Validate Compose
        run: docker compose -f deploy/docker-compose.yaml config

      - name: Validate Docker runner Compose
        run: COMPOSE_FILE=deploy/docker-compose.yaml:deploy/docker-compose.docker-runner.yaml docker compose config

      - name: Validate Production Compose
        run: scripts/ci/check-prod-compose.sh

  smoke:
    name: Docker Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: soj-ci-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start smoke stack
        run: docker compose -f deploy/docker-compose.yaml up --build -d

      - name: Run smoke test
        run: ./deploy/smoke.sh

      - name: Dump smoke logs on failure
        if: failure()
        run: |
          docker compose -f deploy/docker-compose.yaml ps || true
          docker compose -f deploy/docker-compose.yaml logs --no-color api worker judge-agent migrate seed postgres redis minio prometheus || true

      - name: Stop smoke stack
        if: always()
        run: docker compose -f deploy/docker-compose.yaml down -v --remove-orphans || true
